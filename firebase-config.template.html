<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firebase 設定範本</title></head><body><script>
// Firebase Console 的 Web App 設定：請只填入 apiKey、authDomain、projectId、appId。

  apiKey: '在 Firebase Console 複製 apiKey',
  authDomain: '你的專案 ID.firebaseapp.com',
  projectId: '你的專案 ID',
  appId: '在 Firebase Console 複製 appId'
};
</script></body></html>
